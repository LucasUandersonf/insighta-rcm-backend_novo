[pytest]
asyncio_mode = auto
# DECISÃO — loop_scope = session
# -------------------------------------------------------------------
# tests/conftest.py tem fixtures assíncronas de escopo SESSION
# (_test_database, app_instance — o banco de teste e o app FastAPI são
# criados uma vez só, reaproveitados por todos os testes). O
# pytest-asyncio 1.x, por padrão, dá um event loop por FUNÇÃO de teste
# (asyncio_default_test_loop_scope=function) — misturado com uma
# fixture de sessão, isso gera exatamente
# "RuntimeError: Runner.run() cannot be called from a running event loop"
# (o loop da sessão e o loop por-função competem entre si). Forçar os
# dois para "session" garante um único event loop compartilhado por
# toda a suíte, consistente com o escopo real das fixtures.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
