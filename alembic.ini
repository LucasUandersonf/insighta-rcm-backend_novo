[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url NÃO é preenchido aqui de propósito — a URL real vem de
# app.core.config.get_settings() dentro de alembic/env.py, lida do
# mesmo .env que a aplicação usa. Isso evita ter a credencial do banco
# duplicada em dois arquivos (drift entre .env e alembic.ini).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
